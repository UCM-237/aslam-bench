# Plataforma de referencia (iteración 1).
# Fuente única de parámetros para el simulador 2D, los nodos ROS 2 y el cálculo de métricas.
# Si tu hardware difiere (otro LiDAR, otra velocidad), cambia aquí y en ningún otro sitio.
platform:
  name: create3_lidar2d_ref
  base:
    model: iRobot Create 3
    radius: 0.171            # m (diámetro 342 mm)
    max_lin_vel: 0.26        # m/s (Create 3 admite 0.306; 0.26 = valor por defecto de Nav2 en TurtleBot 4)
    max_ang_vel: 1.0         # rad/s
  lidar:
    # RPLIDAR C1 (el del robot de c3-aslamdrl-platform y el que vio el agente DRL al entrenar):
    # 5 kHz de muestreo a 10 Hz -> 500 haces (0,72°), 0,05-12 m (6 m con superficies oscuras).
    # Iteración 1 usaba el RPLIDAR A1M8 del TurtleBot 4: range_min 0.15, n_beams 360, rate_hz 5.5.
    model: RPLIDAR C1
    frame: rplidar_link      # TurtleBot 4; en el Create 3 de c3-aslamdrl-platform es 'laser'
    topic: /scan
    range_min: 0.05          # m
    range_max: 12.0          # m
    fov_deg: 360
    n_beams: 500
    rate_hz: 10.0
    noise_std: 0.01          # m (simulador 2D; mismo valor que el sensor de entrenamiento)
  camera:
    model: OAK-D Lite (RGB, usada como monocular)
    enabled: false           # presente en el modelo y publicando, pero NO la consume ningún método en la iteración 1
    topic: /oakd/rgb/preview/image_raw
    frame: oakd_rgb_camera_optical_frame
    hfov_deg: 69
    resolution: [320, 240]
  compute: Raspberry Pi 4 (a bordo, TurtleBot 4) / PC de simulación

mapping:
  resolution: 0.05           # m/celda
  free_thresh: 25            # OccupancyGrid: 0 <= v < 25 -> libre
  occ_thresh: 65             # v >= 65 -> ocupado; resto -> desconocido

navigation:
  inflation_margin: 0.05     # m extra sobre el radio del robot para planificar
  goal_tolerance: 0.25       # m (xy_goal_tolerance de Nav2)

exploration:
  min_frontier_size: 0.30    # m (clusters más pequeños se ignoran)
  min_unknown_cells: 10      # 'agujeros' desconocidos más pequeños no generan fronteras
  replan_period: 1.0         # s, frecuencia de la lógica de decisión
  goal_timeout_min: 30.0     # s, tiempo mínimo antes de abandonar un objetivo
  goal_timeout_factor: 3.0   # timeout = max(min, factor * distancia / v_max)
  blacklist_radius: 0.5      # m, objetivos fallidos se vetan en este radio
  random_goal_dist: [1.0, 4.0]  # m, rango de distancia geodésica de B0

# Parámetros de las estrategias B2-B8 (aslam_bench/core/strategies.py). Se guardan en el
# meta.json de cada episodio (strategy_params). Valores iniciales razonables, SIN AJUSTAR:
# el plan pide ajustarlos en mapas de validación con un presupuesto comparable al del DRL.
strategies:
  ig_radius: 4.0             # m, alcance para estimar la IG (área desconocida visible) de un punto
  ig_rays: 120               # rayos para esa estimación
  B2: {lambda_cost: 1.0}     # U = IG(m²) − λ·d(m)
  B3:                        # RRT-exploration (Umari & Mukhopadhyay 2017); defaults del paquete original
    eta_global: 1.0          # m, paso del RRT global (persistente)
    eta_local: 0.5           # m, paso del RRT local (se reinicia en el robot)
    iters_global: 60         # iteraciones por ciclo de decisión (1 Hz)
    iters_local: 60
    info_radius: 1.0         # m, disco para la IG del asignador
    info_multiplier: 3.0
    hysteresis_radius: 3.0
    hysteresis_gain: 2.0
    cluster_radius: 0.5      # m, agrupamiento de puntos frontera (mean-shift en el original)
    min_gain: 0.05           # m², puntos con menos IG se descartan
    max_points: 300
    max_nodes: 4000
    seed: 0
  B4: {lambda_cost: 1.0, w_pose: 1.0, max_lc_candidates: 8, lc_max_dist: 10.0}   # w_pose: m² por bit de pose
  B5: {lambda_cost: 1.0, w_dopt: 1.0, max_lc_candidates: 8, lc_max_dist: 10.0}   # w_dopt: m² por nat de D-opt
  B6:                        # NBVP 2D (Bircher et al. 2016)
    iters: 80                # iteraciones mínimas del RRT por decisión
    max_iters: 300           # máximo si no aparece ganancia
    max_nodes: 150
    step: 1.0                # m, longitud máxima de arista
    lam: 0.5                 # 1/m, descuento exp(−λ·c) de la ganancia con la distancia
    min_gain: 0.5            # m², por debajo se considera que no hay nada que ver cerca
    min_step: 0.6            # m, primer tramo mínimo que se ejecuta
    box: 5.0                 # m, semiancho de la región de muestreo alrededor del robot
    ig_rays: 60
    seed: 0
  B7: {weights: ''}          # .npz de la red que puntúa fronteras (no incluido: hay que entrenarla)
  B8:                        # U = w_e·IG_geom + w_s·IG_sem + w_l·LC − w_c·coste (capa semántica §7)
    w_e: 1.0                 # por m² desconocido visible
    w_s: 3.0                 # por bit de entropía de clase en el FOV de la cámara
    w_l: 2.0                 # por bit de reducción de entropía de pose (si var > var_threshold)
    w_c: 1.0                 # por m de recorrido
    var_threshold: 0.05      # m², varianza de pose (por eje) a partir de la que se busca cerrar bucles
    n_yaws: 8                # orientaciones finales evaluadas
    view_dist: 1.5           # m, distancia de los puntos de vista a un landmark
    entropy_threshold: 1.0   # bits; landmarks más inciertos (o 'tentative') generan puntos de vista
    tentative_bonus: 0.5
    max_visits: 2            # puntos de vista por landmark como mucho
    max_lc_candidates: 6
    lc_max_dist: 10.0

# Grafo de poses sustituto (core/posegraph.py) para B4, B5 y B8: keyframes de la trayectoria
# estimada, odometría con información 1/(σ²·d) y cierres de bucle al volver cerca de un keyframe.
pose_graph:
  kf_spacing: 0.5            # m entre keyframes
  sigma_odom: 0.1            # m/√m
  sigma_lc: 0.1              # m
  lc_radius: 1.0             # m
  lc_min_sep: 20             # keyframes mínimos (10 m) entre los extremos de un cierre de bucle
  lc_cooldown: 10            # keyframes sin nuevos cierres tras uno (no uno por keyframe al repasar)

# Capa semántica. En sim2d: objetos sintéticos junto a las paredes y cámara simulada (B8 decide
# con ella; el resto de métodos solo la registran, para comparar sem_* en meta.json).
# En ROS: B8 lee el mapa semántico del tópico semantic_topic del explorador.
semantics:
  sim_enabled: true
  classes: [chair, couch, bed, dining table, toilet, sink, refrigerator, oven, tv, potted plant]
  objects_per_m2: 0.06       # densidad de objetos sintéticos (sobre el área libre del mapa)
  objects_seed: 0            # los objetos dependen solo del mapa y de esta semilla
  cam_range: 4.0             # m
  cam_period: 0.5            # s entre imágenes procesadas
  p_detect: 0.8              # probabilidad de detectar un objeto visible
  p_correct: 0.7             # probabilidad de acertar la clase
  sigma_pos: 0.05            # m, ruido de posición de la detección
  confirm_obs: 3             # 'confirmed' con >= 3 observaciones ...
  confirm_views: 2           # ... desde >= 2 poses distintas
  view_sep: 0.5              # m entre poses para contar como distintas

# Agente DRL (TD3 de c3-aslamdrl-platform, rama drl). Solo lo usan los métodos 'DRL...'.
# Elegir el .pt: aquí, en el bloque `drl:` de la campaña, con 'DRL:<ruta.pt>' / 'DRL:<alias>'
# en `methods:`, con el argumento drl_weights:=... del launch o con ASLAM_BENCH_DRL_WEIGHTS.
drl:
  weights: ''                # actor_stage{S}_episode{N}.pt (state_dict del actor), para 'DRL'
  agents: {}                 # alias -> .pt, para 'DRL:<alias>' (p. ej. varias semillas/episodios)
  step_period: 0.1           # s entre acciones (STEP_TIME del entrenamiento)
  clip_to_platform: true     # recortar (v, w) a platform.base (entrenado con 0,3 m/s y 1,9 rad/s)
  device: cpu
  torch_threads: 1           # hilos de torch por proceso (1 = lo mejor con run_campaign -j N)

episode:
  coverage_target: 0.95      # fracción del área alcanzable
  t_max: 900.0               # s de tiempo simulado
  snapshot_period: 5.0       # s entre instantáneas del mapa
  pose_period: 0.2           # s entre muestras de pose
  stall_window: 300.0        # s sin ganar cobertura ...
  stall_min_gain: 0.01       # ... al menos esta fracción -> fallo por estancamiento
  reachable_margin: 0.10     # m que se añaden al radio al definir el área alcanzable
